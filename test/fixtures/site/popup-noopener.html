<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture Popup Noopener</title>
</head>
<body>
<button id="open">Open</button>
<script>
  // noopener：新页面没有 opener。目标放在另一个主机名上，让它的主机不靠规则也能判断出来源。
  document.getElementById('open').addEventListener('click', () => {
    window.open('{{ALT_ORIGIN}}/popup-child.html', '_blank', 'noopener');
  });
</script>
</body>
</html>
