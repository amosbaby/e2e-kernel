<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture WebSocket</title>
</head>
<body>
<p id="ws-state">connecting</p>
<script>
  const ws = new WebSocket('ws://' + location.host + '/ws');
  ws.addEventListener('open', () => {
    document.getElementById('ws-state').textContent = 'open';
  });
</script>
</body>
</html>
