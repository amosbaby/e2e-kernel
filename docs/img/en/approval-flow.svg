<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="title desc">
<title id="title">Read-only mode and human approval</title>
<desc id="desc">A write on a read-only host is blocked. The agent declares it with step --allow, the command exits 21 and a dialog asks a person; after the person clicks allow, the same command run again goes through. A changed rules.json works the same way at open and login.</desc>
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .t { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif; }
  .m { fill: #59636e; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .b { font-weight: 600; }
  .box { fill: #f6f8fa; stroke: #d0d7de; }
  .blue { fill: #ddf4ff; stroke: #0969da; }
  .green { fill: #dafbe1; stroke: #1a7f37; }
  .yellow { fill: #fff8c5; stroke: #9a6700; }
  .red { fill: #ffebe9; stroke: #cf222e; }
  .purple { fill: #fbefff; stroke: #8250df; }
  .gray { fill: #f6f8fa; stroke: #818b98; }
  .edge { stroke: #59636e; fill: none; }
  .head { fill: #59636e; }
  .dash { stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .t { fill: #e6edf3; }
    .m { fill: #9198a1; }
    .box { fill: #161b22; stroke: #3d444d; }
    .blue { fill: #0c2d6b; stroke: #4493f8; }
    .green { fill: #04260f; stroke: #3fb950; }
    .yellow { fill: #3b2e00; stroke: #d29922; }
    .red { fill: #42080b; stroke: #f85149; }
    .purple { fill: #2e1a4f; stroke: #ab7df8; }
    .gray { fill: #161b22; stroke: #9198a1; }
    .edge { stroke: #9198a1; }
    .head { fill: #9198a1; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="879" height="439" rx="12"/>
<text class="t b" x="32" y="44.0" font-size="20" text-anchor="start">Read-only by default, a person approves the exceptions</text><text class="t b" x="32" y="80.0" font-size="14" text-anchor="start">A write the rules block</text><rect class="red" x="28" y="92" width="146" height="92" rx="8" stroke-width="1.5"/>
<text class="t" x="101" y="123.3" font-size="14" text-anchor="middle">step: page sends</text>
<text class="t code" x="101" y="142.9" font-size="14" text-anchor="middle">POST /v1/items</text>
<text class="t m" x="101" y="162.5" font-size="14" text-anchor="middle">→ 403, recorded</text><path class="edge" d="M174,138 L196,138" stroke-width="1.6" marker-end="url(#arrow)"/><rect class="box" x="198" y="92" width="146" height="92" rx="8" stroke-width="1.5"/>
<text class="t" x="271" y="123.3" font-size="14" text-anchor="middle">step … --allow</text>
<text class="t code" x="271" y="142.9" font-size="14" text-anchor="middle">POST /v1/items</text>
<text class="t m" x="271" y="162.5" font-size="14" text-anchor="middle">declares the write</text><path class="edge" d="M344,138 L366,138" stroke-width="1.6" marker-end="url(#arrow)"/><rect class="purple" x="368" y="92" width="146" height="92" rx="8" stroke-width="1.5"/>
<text class="t" x="441" y="123.3" font-size="14" text-anchor="middle">exit 21</text>
<text class="t m" x="441" y="142.9" font-size="14" text-anchor="middle">dialog</text>
<text class="t" x="441" y="162.5" font-size="14" text-anchor="middle">e2k：放行写请求</text><path class="edge" d="M514,138 L536,138" stroke-width="1.6" marker-end="url(#arrow)"/><rect class="yellow" x="538" y="92" width="146" height="92" rx="8" stroke-width="1.5"/>
<text class="t" x="611" y="133.1" font-size="14" text-anchor="middle">Person clicks</text>
<text class="t b" x="611" y="152.7" font-size="14" text-anchor="middle">放行 (allow)</text><path class="edge" d="M684,138 L706,138" stroke-width="1.6" marker-end="url(#arrow)"/><rect class="green" x="708" y="92" width="146" height="92" rx="8" stroke-width="1.5"/>
<text class="t" x="781" y="123.3" font-size="14" text-anchor="middle">Run it again</text>
<text class="t m" x="781" y="142.9" font-size="14" text-anchor="middle">unchanged</text>
<text class="t m" x="781" y="162.5" font-size="14" text-anchor="middle">→ batch runs</text><text class="t b" x="32" y="238.0" font-size="14" text-anchor="start">A changed rules.json</text><rect class="box" x="28" y="250" width="146" height="92" rx="8" stroke-width="1.5"/>
<text class="t" x="101" y="291.1" font-size="14" text-anchor="middle">rules.json edited</text>
<text class="t m" x="101" y="310.7" font-size="14" text-anchor="middle">(a person keeps it)</text><path class="edge" d="M174,296 L196,296" stroke-width="1.6" marker-end="url(#arrow)"/><rect class="box" x="198" y="250" width="146" height="92" rx="8" stroke-width="1.5"/>
<text class="t" x="271" y="291.1" font-size="14" text-anchor="middle">open / login</text>
<text class="t m" x="271" y="310.7" font-size="14" text-anchor="middle">answer exit 21</text><path class="edge" d="M344,296 L366,296" stroke-width="1.6" marker-end="url(#arrow)"/><rect class="purple" x="368" y="250" width="146" height="92" rx="8" stroke-width="1.5"/>
<text class="t" x="441" y="281.3" font-size="14" text-anchor="middle">exit 21</text>
<text class="t m" x="441" y="300.9" font-size="14" text-anchor="middle">dialog</text>
<text class="t" x="441" y="320.5" font-size="14" text-anchor="middle">e2k：域名规则改了</text><path class="edge" d="M514,296 L536,296" stroke-width="1.6" marker-end="url(#arrow)"/><rect class="yellow" x="538" y="250" width="146" height="92" rx="8" stroke-width="1.5"/>
<text class="t" x="611" y="291.1" font-size="14" text-anchor="middle">Person clicks</text>
<text class="t b" x="611" y="310.7" font-size="14" text-anchor="middle">批准 (approve)</text><path class="edge" d="M684,296 L706,296" stroke-width="1.6" marker-end="url(#arrow)"/><rect class="green" x="708" y="250" width="146" height="92" rx="8" stroke-width="1.5"/>
<text class="t" x="781" y="281.3" font-size="14" text-anchor="middle">Run it again</text>
<text class="t m" x="781" y="300.9" font-size="14" text-anchor="middle">unchanged</text>
<text class="t m" x="781" y="320.5" font-size="14" text-anchor="middle">→ rules in force</text><text class="t m" x="611" y="202.0" font-size="12" text-anchor="middle">拒绝 (deny) → exit 2</text><text class="t m" x="611" y="360.0" font-size="12" text-anchor="middle">拒绝 (deny) → exit 2</text><text class="t m" x="32" y="396.0" font-size="13" text-anchor="start">Until approved, only new or tightened (read-only, deny) rules entries apply at once.</text><text class="t m" x="32" y="420.0" font-size="13" text-anchor="start">No approve command, no auto-approve flag; with start --no-dialogs every approval request ends in exit 22.</text>
</svg>
