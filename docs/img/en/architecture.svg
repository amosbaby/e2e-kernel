<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="title desc">
<title id="title">e2k architecture</title>
<desc id="desc">An AI agent runs the e2k CLI; the CLI talks to a resident kernel over a local socket; the kernel drives one headed Chrome per profile over a pipe, asks a person through dialogs, and writes a report per session.</desc>
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .t { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif; }
  .m { fill: #59636e; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .b { font-weight: 600; }
  .box { fill: #f6f8fa; stroke: #d0d7de; }
  .blue { fill: #ddf4ff; stroke: #0969da; }
  .green { fill: #dafbe1; stroke: #1a7f37; }
  .yellow { fill: #fff8c5; stroke: #9a6700; }
  .red { fill: #ffebe9; stroke: #cf222e; }
  .purple { fill: #fbefff; stroke: #8250df; }
  .gray { fill: #f6f8fa; stroke: #818b98; }
  .edge { stroke: #59636e; fill: none; }
  .head { fill: #59636e; }
  .dash { stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .t { fill: #e6edf3; }
    .m { fill: #9198a1; }
    .box { fill: #161b22; stroke: #3d444d; }
    .blue { fill: #0c2d6b; stroke: #4493f8; }
    .green { fill: #04260f; stroke: #3fb950; }
    .yellow { fill: #3b2e00; stroke: #d29922; }
    .red { fill: #42080b; stroke: #f85149; }
    .purple { fill: #2e1a4f; stroke: #ab7df8; }
    .gray { fill: #161b22; stroke: #9198a1; }
    .edge { stroke: #9198a1; }
    .head { fill: #9198a1; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="879" height="379" rx="12"/>
<text class="t b" x="32" y="44.0" font-size="20" text-anchor="start">How e2k fits together</text><rect class="box" x="28" y="96" width="130" height="74" rx="8" stroke-width="1.5"/>
<text class="t" x="93" y="127.8" font-size="15" text-anchor="middle">AI agent</text>
<text class="t m" x="93" y="148.8" font-size="15" text-anchor="middle">verifies pages</text><rect class="box" x="188" y="96" width="170" height="74" rx="8" stroke-width="1.5"/>
<text class="t" x="273" y="127.8" font-size="15" text-anchor="middle">e2k CLI</text>
<text class="t m code" x="273" y="148.8" font-size="13" text-anchor="middle">open · step · close</text><rect class="blue" x="456" y="74" width="200" height="150" rx="8" stroke-width="1.5"/>
<text class="t" x="556" y="122.8" font-size="15" text-anchor="middle">Resident kernel</text>
<text class="t m" x="556" y="143.8" font-size="15" text-anchor="middle">domain rules · read-only</text>
<text class="t m" x="556" y="164.8" font-size="15" text-anchor="middle">approvals · identity probe</text>
<text class="t m" x="556" y="185.8" font-size="15" text-anchor="middle">records · redaction</text><rect class="box" x="720" y="84" width="136" height="74" rx="8" stroke-width="1.5"/><rect class="box" x="712" y="96" width="136" height="74" rx="8" stroke-width="1.5"/>
<text class="t" x="780" y="127.8" font-size="15" text-anchor="middle">Headed Chrome</text>
<text class="t m" x="780" y="148.8" font-size="15" text-anchor="middle">one per profile</text><rect class="yellow" x="188" y="270" width="170" height="70" rx="8" stroke-width="1.5"/>
<text class="t" x="273" y="299.8" font-size="15" text-anchor="middle">Person</text>
<text class="t m" x="273" y="320.8" font-size="15" text-anchor="middle">logs in · approves</text><rect class="green" x="700" y="262" width="156" height="86" rx="8" stroke-width="1.5"/>
<text class="t" x="778" y="289.3" font-size="15" text-anchor="middle">Report</text>
<text class="t m code" x="778" y="310.3" font-size="13" text-anchor="middle">report.html</text>
<text class="t m code" x="778" y="331.3" font-size="13" text-anchor="middle">result.json</text><path class="edge" d="M158,133 L186,133" stroke-width="1.6" marker-end="url(#arrow)"/><path class="edge" d="M358,133 L454,133" stroke-width="1.6" marker-end="url(#arrow)"/><text class="t m code" x="406" y="124.0" font-size="12" text-anchor="middle">kernel.sock</text><path class="edge" d="M656,133 L710,133" stroke-width="1.6" marker-end="url(#arrow)"/><text class="t m" x="780" y="196.0" font-size="12" text-anchor="middle">pipe, no debug port</text><path class="edge" d="M360,305 L540,305 L540,226" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text class="t m" x="450" y="296.0" font-size="13" text-anchor="middle">login · dialogs</text><path class="edge" d="M610,226 L610,305 L698,305" stroke-width="1.6" marker-end="url(#arrow)"/><text class="t m" x="654" y="296.0" font-size="13" text-anchor="middle">on close</text><text class="t m" x="32" y="364.0" font-size="13" text-anchor="start">The kernel never calls a model, never types a password and never solves a CAPTCHA.</text>
</svg>
